name: ${APP_NAME_HOST}

volumes:
  habitat-config:


services:

  habitat-config:
    image: tschebbischeff/habitat-config:latest
    container_name: ${APP_NAME_HOST}_${APP_MODULE_NAME}_habitat-config
    restart: no
    env_file:
      - ./.env
      - path: ${ENV_DIR}/.env
        required: false
      - path: ${ENV_DIR}/habitat-config.env
        required: false
    networks:
      internal:
    volumes:
      - habitat-config:/habitat-config/orchestration
      - ./habitat-config:/habitat-config/source:ro
